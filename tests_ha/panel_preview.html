<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  .light {
    --primary-background-color: #fafafa; --card-background-color: #fff; --secondary-background-color: #e5e5e5;
    --primary-text-color: #212121; --secondary-text-color: #616161; --divider-color: #e0e0e0;
    --primary-color: #03a9f4; --text-primary-color: #fff; --error-color: #db4437; --warning-color: #b35a00;
  }
  .dark {
    --primary-background-color: #111; --card-background-color: #1c1c1c; --secondary-background-color: #2c2c2c;
    --primary-text-color: #e1e1e1; --secondary-text-color: #a0a0a0; --divider-color: #333;
    --primary-color: #03a9f4; --text-primary-color: #fff; --error-color: #ff6b5e; --warning-color: #ffa94d;
    --app-header-background-color: #1c1c1c; --app-header-text-color: #e1e1e1;
  }
  #tools { position: fixed; right: 8px; top: 8px; z-index: 1; }
</style>
</head>
<body class="light">
<!-- A development aid: serve the repository root and open this page to see the panel with made-up rooms. -->
<div id="tools"><button id="theme">Theme</button> <button id="empty">Empty</button></div>
<what-the-heat-panel id="panel"></what-the-heat-panel>
<script src="../custom_components/what_the_heat/frontend/panel.js"></script>
<script>
  const KEYS = {
    zone: "climate", mode: "select", duty: "sensor", time_in_band_today: "sensor", rms_deviation_today: "sensor",
    heating_today: "sensor", longest_closed_today: "sensor", water_temperature: "sensor",
    setpoint_writes: "sensor", resends: "sensor", valve_requested: "binary_sensor", problem: "binary_sensor",
  };
  const ROOMS = [
    { id: "kitchen", name: "Old Kitchen", area: "Basement", mode: "observe", temp: 18.9, target: 21, action: "idle", duty: 100, band: 0, rms: 2.1, heating: 0, off: 0.02, writes: 0, resends: 0, valve: "on", reasons: [] },
    { id: "office", name: "Office", area: "Basement", mode: "active", temp: 21.1, target: 21, action: "heating", duty: 37, band: 98.4, rms: 0.08, heating: 36.5, off: 1.1, writes: 31, resends: 0, valve: "on", reasons: [] },
    { id: "bedroom", name: "A bedroom with a really quite long name that has to wrap", area: "", mode: "active", temp: 20.2, target: 21, action: "idle", duty: 64, band: 41, rms: 0.61, heating: 12, off: 5.4, writes: 47, resends: 6, valve: "off", reasons: ["thermostat_not_following", "readings_missing"] },
    { id: "hall", name: "Hall", area: "Ground floor", mode: "handback", temp: null, target: 20.5, action: null, duty: null, band: null, rms: null, heating: null, off: null, writes: 2, resends: 0, valve: "off", reasons: [] },
  ];
  let water = 30;
  const stateOf = (room, key) => {
    const updated = String(Date.now());
    const base = { last_updated: updated, attributes: {} };
    const value = { duty: room.duty, time_in_band_today: room.band, rms_deviation_today: room.rms, heating_today: room.heating, longest_closed_today: room.off, water_temperature: water, setpoint_writes: room.writes, resends: room.resends, mode: room.mode, valve_requested: room.valve }[key];
    if (key === "zone") return { ...base, state: "heat", attributes: { current_temperature: room.temp, temperature: room.target, hvac_action: room.action, min_temp: 5, max_temp: 30 } };
    if (key === "problem") return { ...base, state: room.reasons.length ? "on" : "off", attributes: { reasons: room.reasons } };
    return { ...base, state: value === null ? "unknown" : String(value) };
  };
  const panel = document.getElementById("panel");
  let rooms = ROOMS;
  const build = () => {
    const hass = { states: {}, entities: {}, devices: {}, areas: {}, locale: { language: "en" } };
    for (const room of rooms) {
      hass.devices[room.id] = { name: room.name, area_id: room.area };
      if (room.area) hass.areas[room.area] = { name: room.area };
      for (const [key, domain] of Object.entries(KEYS)) {
        const entityId = `${domain}.${room.id}_${key}`;
        hass.entities[entityId] = { entity_id: entityId, device_id: room.id, platform: "what_the_heat", translation_key: key };
        hass.states[entityId] = stateOf(room, key);
      }
    }
    hass.callService = (domain, service, data) => {
      if (service === "set_water_temperature") {
        water = data.temperature;
        panel.hass = build();
        return;
      }
      const room = rooms.find((item) => data.entity_id.includes(`.${item.id}_`));
      if (service === "set_temperature") room.target = data.temperature;
      if (service === "select_option") room.mode = data.option;
      panel.hass = build();
    };
    return hass;
  };
  panel.hass = build();
  document.getElementById("theme").onclick = () => {
    document.body.className = document.body.className === "light" ? "dark" : "light";
  };
  document.getElementById("empty").onclick = () => {
    rooms = rooms.length ? [] : ROOMS;
    panel.hass = build();
  };
</script>
</body>
</html>
